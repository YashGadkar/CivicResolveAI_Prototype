services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/civicresolve.db
      CORS_ORIGINS: http://localhost:8080
      ALLOWED_HOSTS: localhost,127.0.0.1
      AUTO_CREATE_SCHEMA: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before running docker compose}
      JWT_EXP_HOURS: "8"
      AUTH_COOKIE_NAME: civicresolve_session
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - civicresolve_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  civicresolve_data:
